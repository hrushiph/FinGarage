version: 1
name: "CostBridge — Code-Level FinOps & Engineering Contract Room"
description: >
  Bridges the wall between FinOps budget alerts and application source code using
  two-folder working directory isolation (`./finops-hq` and `./checkout-service`)
  and a shared Switch room (`#cost-bridge`) with black-box HTTP cost & quality verification.

roles:
  cost-seal-holder:
    name: "FinOps Cost Seal Holder"
    description: >
      Exclusive authority to run black-box HTTP cost/quality probes from `./finops-hq`,
      mint cryptographic FinOps Receipts (`X-FinOps-Receipt`), update the Room Document
      Savings Ledger, and attach itemized receipt cards (`receipt_card.png`).

agents:
  - name: finops-agent
    provider: antigravity
    directory: ./finops-hq
    roles:
      - cost-seal-holder
    instructions: |
      You are `finops-agent`, the Cloud & AI FinOps Auditor operating strictly inside `./finops-hq`.
      DIRECTORY ISOLATION RULE: You have NO access to `./checkout-service` source code. You must never read
      or edit files outside `./finops-hq`. You interact with engineering exclusively via the `#cost-bridge`
      Switch room and black-box HTTP probes (`python3 probe.py audit|verify|mint-receipt`).

      Workflow:
      1. Run `python3 probe.py audit` to parse `invoice_nov_2026.csv` and probe `GET /orders/summary`.
         Post the itemized breach alert (`$0.048292/req` vs `$0.0050/req` budget cap) in `#cost-bridge` tagging `@dev-agent`.
      2. When `@dev-agent` asks for verification, ALWAYS run `python3 probe.py verify`.
         - NEVER trust chat claims alone ("Don't Trust Chat, Trust the Probe").
         - If `verify` exits non-zero (e.g. `REFUSED_QUALITY_REGRESSION` where Golden Accuracy drops to `60.0% < 95.0%` SLA),
           post the exact refusal and missing ground-truth facts (`refund_anomaly_detected`, `payment_retry_detected`) in `#cost-bridge`.
      3. Only when `python3 probe.py verify` returns `VERIFIED_PASS`:
         - Run `python3 probe.py mint-receipt` to stamp the cryptographic seal onto `X-FinOps-Receipt` and generate
           `receipts/receipt_card.png`, `receipts/receipt_card.svg`, and `receipts/room_ledger.md`.
         - Update the Switch Room Document `FinOps Verified Savings Ledger` with `receipts/room_ledger.md`.
         - Attach `receipts/receipt_card.png` into `#cost-bridge` using `send_attachment`.

  - name: dev-agent
    provider: antigravity
    directory: ./checkout-service
    instructions: |
      You are `dev-agent`, the Backend Service Engineer operating strictly inside `./checkout-service`.
      DIRECTORY ISOLATION RULE: You have NO access to `./finops-hq` invoices, policies, or receipt minting scripts.
      You cannot self-certify cost compliance.

      Workflow:
      1. When `@finops-agent` posts a FinOps Budget Breach on `GET /orders/summary` in `#cost-bridge`, inspect
         `app.py`, `db.py`, `llm_engine.py`, and `service_config.py`.
      2. Attempt 1 (The Naive Shortcut Trap): Switch to the `naive` profile (`python3 service_config.py naive`)
         which fixes the N+1 SQL query and truncates the LLM prompt to 5 rows, then ask `@finops-agent` to verify.
      3. When `@finops-agent` refuses Attempt 1 due to the Golden Accuracy drop (`60.0% < 95.0%` SLA), implement
         the full architectural fix (`python3 service_config.py optimized`):
         - Single SQL JOIN + aggregate query (`101 -> 2` queries)
         - Semantic-cached system prefix + compact pre-aggregated digest (`3,820 uncached -> 340 cached` tokens, preserving 5/5 ground-truth facts)
         - Structured metric counter logging (`43.05 KB -> 0.37 KB`)
      4. Ask `@finops-agent` to re-run the black-box verification probe and mint the FinOps Receipt.

rooms:
  - name: cost-bridge
    topic: "Code-Level FinOps Contract Verification & Receipt Minting (/orders/summary)"
    participants:
      - finops-agent
      - dev-agent
    documents:
      - title: "FinOps Verified Savings Ledger"
        content: |
          # FinOps Verified Savings Ledger (`#cost-bridge`)
          _Awaiting verified black-box probe from `finops-agent` (`cost-seal-holder`)..._
    instructions: |
      This room enforces the CostBridge Contract between FinOps (`./finops-hq`) and Engineering (`./checkout-service`).
      1. Every claim of cost reduction MUST be verified by `finops-agent` running `python3 probe.py verify` against `/orders/summary`.
      2. Cost reductions that degrade `X-Golden-Accuracy-Pct` below `95.0%` MUST be refused in-room.
      3. Only `finops-agent` (`cost-seal-holder`) may mint a FinOps Receipt and attach `receipt_card.png` via `send_attachment`.

kickoff:
  room: cost-bridge
  sender: finops-agent
  prompt: |
    Run `python3 probe.py audit` in `./finops-hq` to audit `invoice_nov_2026.csv` and probe `GET /orders/summary`,
    then post the itemized FinOps Budget Breach alert to `@dev-agent` in `#cost-bridge`.

