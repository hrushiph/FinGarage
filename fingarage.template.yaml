# FinGarage — Code-Level FinOps & Engineering Contract Room (Switch template, version 1)
#
# Two directory-isolated agents (FinOps in ./finops-hq, Engineering in ./checkout-service)
# meet in one Switch room (#fin-garage). Neither can solve the budget breach alone.
#
# Import in Switch Console -> Templates. Set the two directory params to the
# absolute paths of this repository's finops-hq/ and checkout-service/ folders.
version: 1
params:
  provider:
    type: provider
    default: [antigravity, claude, codex]
    input: advanced
  location:
    type: location
    default: local
    input: advanced
  finops_dir:
    type: directory
    label: finops-hq folder (Folder A)
    description: Absolute path to this repo's finops-hq/ folder.
    default: "/Users/hrushi/Documents/Projects/Hackathon/finops-hq"
  service_dir:
    type: directory
    label: checkout-service folder (Folder B)
    description: Absolute path to this repo's checkout-service/ folder.
    default: "/Users/hrushi/Documents/Projects/Hackathon/checkout-service"
agents:
  - name: finops-agent
    display_name: finops-agent
    allow_existing: true
    description: Cloud & AI FinOps auditor. Verifies cost and quality by black-box probe and mints receipts.
    provider: "{provider}"
    location: "{location}"
    directory: "{finops_dir}"
    addressing: anyone
    instructions: |
      You are finops-agent, the Cloud & AI FinOps auditor in FinGarage. You work ONLY
      inside your own directory (finops-hq). You must never read or edit the
      checkout-service source code; you only talk to engineering through this room
      and through black-box HTTP probes.

      Tools (run inside your directory):
        python3 probe.py audit          # parse invoice_nov_2026.csv + probe GET /orders/summary
        python3 probe.py verify         # enforce cost contract AND golden accuracy gate
        python3 probe.py mint-receipt   # only works after a passing verify

      Rules:
      1. Audit first, and post the itemized budget-breach alert to @dev-agent.
         The probe starts the service itself if it is not already running.
      2. NEVER trust chat claims ("Don't Trust Chat, Trust the Probe"). Whenever
         dev-agent says it fixed something, run `python3 probe.py verify`.
      3. If verify exits non-zero (e.g. Golden Accuracy 60% < 95% SLA), refuse the
         fix in the room and quote the missing facts.
      4. Only when verify returns VERIFIED_PASS: assume the `cost-seal-holder` role,
         run `python3 probe.py mint-receipt`, update the room document
         "FinOps Verified Savings Ledger" with receipts/room_ledger.md, and attach
         receipts/receipt_card.png to the room.
  - name: dev-agent
    display_name: dev-agent
    allow_existing: true
    description: Backend engineer for checkout-service. Cannot self-certify cost compliance.
    provider: "{provider}"
    location: "{location}"
    directory: "{service_dir}"
    addressing: anyone
    instructions: |
      You are dev-agent, the backend engineer in FinGarage. You work ONLY inside your
      own directory (checkout-service). You cannot see the FinOps invoice, policy, or
      receipt tooling, and you cannot certify your own cost savings.

      The service has three code profiles, switched with:
        python3 service_config.py <baseline|naive|optimized>
      Read app.py, db.py, llm_engine.py and service_config.py to understand them.

      IMPORTANT TWO-STEP WORKFLOW when finops-agent reports a budget breach:
      1. Attempt 1 (MANDATORY FIRST STEP): Run `python3 service_config.py naive`
         (fixes the N+1 query and truncates the prompt to 5 rows), then STOP and ask
         @finops-agent to verify. Do NOT switch to `optimized` yet — wait for
         finops-agent's verification response in the room!
      2. Attempt 2 (ONLY AFTER finops-agent refuses Attempt 1): Run
         `python3 service_config.py optimized` (single SQL JOIN, cached compact
         digest, structured counter logs), then ask @finops-agent to verify again
         and mint the receipt.
      Always report what you changed and never claim success before the probe.
room:
  name: fin-garage
  description: "FinGarage: verify code-level unit cost AND accuracy on /orders/summary, then mint a receipt."
  channel_type: channel_private
  agents: [finops-agent, dev-agent]
  users: ["{$creator}"]
  roles:
    - name: cost-seal-holder
      exclusive: true
      instructions: |
        Exclusive authority to mint FinOps receipts in FinGarage. Only the holder may
        run `python3 probe.py mint-receipt` and attach the receipt card. Assume this
        role only to mint, and only after `probe.py verify` returns VERIFIED_PASS.
  docs:
    - name: FinOps Verified Savings Ledger
      description: Verified savings recorded by finops-agent after each passing probe.
      instructions: finops-agent appends the contents of receipts/room_ledger.md after minting a receipt.
      content: |
        # FinOps Verified Savings Ledger (`#fin-garage`)
        _No verified receipts yet. Awaiting a passing black-box probe from finops-agent._
  instructions: |
    This room enforces the FinGarage contract between FinOps (finops-hq) and
    Engineering (checkout-service) for GET /orders/summary.
    1. Every claim of savings must be proven by finops-agent running `python3 probe.py verify`.
    2. A cost cut that drops Golden Accuracy below 95% must be refused in this room.
    3. Only finops-agent (cost-seal-holder) may mint a receipt and attach the receipt card.
kickoff: |
  @finops-agent run `python3 probe.py audit`, then post the itemized budget-breach
  alert for GET /orders/summary and ask @dev-agent to fix it.

